<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found · Earn the Shelf</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#F6F1E7">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3C16 3 6 15 6 22C6 27.5 10.5 30 16 30C21.5 30 26 27.5 26 22C26 15 16 3 16 3Z' fill='%23123524'/%3E%3Ccircle cx='13' cy='18' r='2' fill='%23E9A23B'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Inter:wght@500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #F6F1E7;
      color: #123524;
      font-family: 'Inter', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }

    .error-card {
      background: #FDFBF7;
      border: 1px solid rgba(18, 53, 36, 0.12);
      border-radius: 20px;
      padding: 3rem 2rem;
      max-width: 460px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(18, 53, 36, 0.08);
    }

    .error-code {
      font-family: 'Fraunces', serif;
      font-size: 4rem;
      font-weight: 700;
      color: #123524;
      line-height: 1;
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: 'Fraunces', serif;
      font-size: 1.5rem;
      margin-bottom: 0.75rem;
      color: #123524;
    }

    p {
      font-size: 0.95rem;
      color: #4E6155;
      line-height: 1.5;
      margin-bottom: 1.75rem;
    }

    .btn-return {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: #E9A23B;
      color: #123524;
      font-weight: 700;
      font-size: 0.92rem;
      padding: 0.75rem 1.6rem;
      border-radius: 9999px;
      text-decoration: none;
      transition: all 0.2s ease;
      min-height: 48px;
    }

    .btn-return:hover {
      background: #D8922C;
      transform: translateY(-1px);
    }

    .btn-return:focus-visible {
      outline: 2px solid #123524;
      outline-offset: 2px;
    }
  </style>
</head>

<body>
  <div class="error-card">
    <div class="error-code">404</div>
    <h1>Page not found</h1>
    <p>The link you followed doesn't exist or has moved. Return to the demand unlock ledger to explore the prototype.</p>
    <a href="/#unlock" class="btn-return">
      Return to Pincode Unlock →
    </a>
  </div>
</body>

</html>
